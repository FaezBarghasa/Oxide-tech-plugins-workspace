[package]
name = "duoxus"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
dioxus = { version = "0.5.1", features = ["web"] }
actix-files = "0.6"
reqwest = { version = "0.11", features = ["json"] }
