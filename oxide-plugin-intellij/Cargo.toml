[package]
name = "oxide-plugin-intellij"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
server_fn = { version = "0.8", optional = true, default-features = false }
server_fn_macro_default = { version = "0.8", optional = true }
rust-embed = { version = "8.0", optional = true }
urlencoding = "2.1.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus = { version = "0.7.2", default-features = false, features = ["router", "hooks", "signals", "macro", "html", "launch", "document"] }
actix-web = { version = "4.13", default-features = false, features = ["macros", "compress-gzip", "compress-zstd", "http2", "cookies"] }
surrealdb = { version = "3", features = ["kv-surrealkv"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }



[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "0.7.2", default-features = false, features = ["router", "web", "hooks", "signals", "macro", "html", "launch", "document"] }
web-sys = { version = "0.3", features = ["Window", "Location", "MouseEvent", "Event", "console", "HtmlInputElement", "HtmlButtonElement", "Navigator", "Clipboard", "HtmlElement", "Document"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
gloo-timers = { version = "0.3", features = ["futures"] }

