[package]
name = "oxide-frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7.0", features = ["web", "desktop", "router", "signals"] }
dioxus-router = "0.7.0"
tokio = { version = "1.41", features = ["full"] }
reqwest = { version = "0.11.27", features = ["json", "stream"] }
tungstenite = "0.23.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
chrono = { version = "0.4.39", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["fmt"] }
gloo = { version = "0.11.0", features = ["console", "timers", "utils"] }
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d", "ImageData", "WebSocket",
    "Window", "Document", "HtmlCanvasElement", "KeyboardEvent"
] }
wasm-bindgen = "0.2"
shared = { path = "../shared" } # Assuming this from the prompt context / code

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
