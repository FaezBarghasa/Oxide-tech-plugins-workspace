[workspace]
members = [
    "crates/shared",
    "crates/api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
authors = ["Oxide-Tech <dev@oxidetech.io>"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["json"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4.39", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
