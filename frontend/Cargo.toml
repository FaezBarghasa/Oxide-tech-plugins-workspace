[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.2", features = ["web", "router", "desktop", "launch"] }
tokio = { version = "1.41.0", features = ["full"] }
reqwest = { version = "0.11.27", features = ["json", "stream"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
chrono = { version = "0.4.39", features = ["serde"] }
uuid = { version = "1.10.0", features = ["v4", "serde"] }
gloo = { version = "0.11.4", features = ["console", "timers", "utils"] }
gloo-storage = "0.3.0"
web-sys = { version = "0.3.70", features = [
    "Canvas",
    "CanvasRenderingContext2d",
    "ImageData",
    "WebSocket",
    "Window",
    "Document",
    "KeyboardEvent",
    "MouseEvent",
    "WheelEvent",
    "HtmlTextAreaElement",
    "HtmlElement",
] }
uniffi = "0.28.0"
shared = { path = "../shared" }
urlencoding = "2.1.3"
futures-util = "0.3.30"
log = "0.4.22"
